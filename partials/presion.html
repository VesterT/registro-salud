<section data-vista="presion">
  <h2 class="titulo-seccion">Presión arterial</h2>
  <form class="tarjeta formulario" data-form="presion">
    <input type="hidden" name="id">
    <div class="fila">
      <label class="campo">Fecha<input type="date" name="fecha" readonly></label>
      <label class="campo">Hora<input type="time" name="hora" required></label>
    </div>
    <div class="fila tres">
      <label class="campo grande">Sistólica<input type="number" name="sistolica" inputmode="numeric" min="50" max="300" required placeholder="120"><small>mmHg (alta)</small></label>
      <label class="campo grande">Diastólica<input type="number" name="diastolica" inputmode="numeric" min="30" max="200" required placeholder="80"><small>mmHg (baja)</small></label>
      <label class="campo grande">Pulso<input type="number" name="pulso" inputmode="numeric" min="30" max="250" placeholder="70"><small>lpm</small></label>
    </div>
    <div class="fila">
      <label class="campo">Brazo
        <select name="brazo"><option>Izquierdo</option><option>Derecho</option></select>
      </label>
      <label class="campo">Posición
        <select name="posicion"><option>Sentada</option><option>De pie</option><option>Acostada</option></select>
      </label>
    </div>
    <label class="campo">Notas<input type="text" name="notas" maxlength="200" placeholder="Opcional: medicamento, síntomas…"></label>
    <div class="acciones">
      <button type="submit" class="boton relleno ancho">Guardar registro</button>
      <button type="button" class="boton texto" data-cancelar hidden>Cancelar edición</button>
    </div>
  </form>

  <div class="encabezado-lista">
    <h3>Registros de hoy</h3>
    <span class="ayuda">Solo se editan los de hoy</span>
  </div>
  <div data-lista-hoy class="lista"></div>
</section>
