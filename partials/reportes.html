<section data-vista="reportes">
  <h2>Reportes</h2>
  <form class="tarjeta filtros" data-filtros>
    <label>Tipo
      <select name="tipo">
        <option value="presion">Presión arterial</option>
        <option value="glucosa">Glucosa</option>
      </select>
    </label>
    <label>Desde<input type="date" name="desde"></label>
    <label>Hasta<input type="date" name="hasta"></label>
    <div class="rapidos">
      <button type="button" data-dias="7">7 días</button>
      <button type="button" data-dias="30">30 días</button>
      <button type="button" data-dias="90">90 días</button>
      <button type="button" data-dias="0">Todo</button>
    </div>
  </form>

  <div class="acciones">
    <button type="button" class="secundario" data-descargar="csv">⬇️ Descargar CSV</button>
    <button type="button" class="secundario" data-descargar="pdf">⬇️ Descargar PDF</button>
  </div>

  <div data-resumen class="resumen"></div>

  <div class="tarjeta grafica"><canvas data-grafica="principal" aria-label="Gráfica principal"></canvas></div>
  <div class="tarjeta grafica" data-contenedor-pulso><canvas data-grafica="pulso" aria-label="Gráfica de pulso"></canvas></div>

  <div class="tabla-envoltura"><table class="tabla" data-tabla></table></div>
</section>
