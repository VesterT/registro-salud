<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Registro de Salud</title>
  <meta name="theme-color" content="#5b3fa8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mi Salud">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="barra-superior">
    <div class="barra-contenido">
      <h1>Bienvenida Vanessa <span aria-hidden="true">💜</span></h1>
      <p id="fecha-hoy" class="subtitulo"></p>
      <span id="estado-almacen" class="chip-estado"></span>
    </div>
  </header>

  <main id="contenido" aria-live="polite"></main>

  <!-- Navegación: las pestañas cargan fragmentos HTML con HTMX -->
  <nav class="navegacion" role="tablist" hx-target="#contenido" hx-swap="innerHTML">
    <button role="tab" class="activa" aria-selected="true" hx-get="partials/presion.html" hx-trigger="click, load">
      <span class="icono"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></span>
      <span class="texto">Presión</span>
    </button>
    <button role="tab" aria-selected="false" hx-get="partials/glucosa.html">
      <span class="icono"><svg viewBox="0 0 24 24"><path d="M12 2c-5.33 4.55-8 8.48-8 11.8 0 4.98 3.8 8.2 8 8.2s8-3.22 8-8.2c0-3.32-2.67-7.25-8-11.8z"/></svg></span>
      <span class="texto">Glucosa</span>
    </button>
    <button role="tab" aria-selected="false" hx-get="partials/reportes.html">
      <span class="icono"><svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg></span>
      <span class="texto">Reportes</span>
    </button>
    <button role="tab" aria-selected="false" hx-get="partials/ajustes.html">
      <span class="icono"><svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg></span>
      <span class="texto">Ajustes</span>
    </button>
  </nav>

  <div id="aviso" class="aviso" role="status" hidden></div>
</body>
</html>
